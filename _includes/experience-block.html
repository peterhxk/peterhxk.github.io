<details class="exp-block">
  <summary>
    <span>{{ include.title }} | <em>{{ include.company }}</em></span>
    <span class="summary-meta">{{ include.date }}</span>
  </summary>
  <div class="content">
    <p><strong>Tech:</strong> {{ include.tech }}</p>
    {{ include.content }}
  </div>
</details>
